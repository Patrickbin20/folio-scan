plugins { id 'com.android.application' }

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.foliodocs.scan'
    compileSdk 35

    defaultConfig {
        applicationId 'com.foliodocs.scan'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }
    // Clé de signature fournie par les secrets GitHub (jamais stockée dans le dépôt)
    signingConfigs {
        release {
            storeFile file(System.getenv('FOLIO_KEYSTORE_PATH') ?: 'release.jks')
            storePassword System.getenv('FOLIO_KEYSTORE_PASSWORD')
            keyAlias 'folio'
            keyPassword System.getenv('FOLIO_KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
