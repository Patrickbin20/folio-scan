name: Build APK

on:
  push:
    branches: [main]
    paths: ['public/**', 'android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Copier l'application web dans l'APK
        run: |
          mkdir -p android/app/src/main/assets
          cp -r public/. android/app/src/main/assets/
          rm -rf android/app/src/main/assets/.well-known

      - name: Clé de signature
        env:
          KS_B64: ${{ secrets.FOLIO_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.FOLIO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FOLIO_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
            echo "Clé permanente utilisée"
          else
            # Pas encore de secrets : clé temporaire (l'APK fonctionne, mais les mises à jour devront être réinstallées)
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias folio -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Folio temporaire" >/dev/null
            echo "::add-mask::$PW"
            echo "FOLIO_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "::warning::Secrets FOLIO_KEYSTORE_B64 / FOLIO_KEYSTORE_PASSWORD absents : clé temporaire"
          fi
          echo "FOLIO_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compiler l'APK signé
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk Folio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Folio-apk
          path: Folio.apk

      - name: Publier la release (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Folio 1.0.${{ github.run_number }}
          body: |
            📥 Téléchargement direct : https://github.com/${{ github.repository }}/releases/latest/download/Folio.apk
          files: Folio.apk
          make_latest: true
