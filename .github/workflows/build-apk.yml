name: Build APK

on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle', 'gradle.properties', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clé de signature
        env:
          KS_B64: ${{ secrets.FOLIO_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.FOLIO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FOLIO_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
            echo "Clé permanente utilisée"
          else
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias folio -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=DocuScan temporaire" >/dev/null
            echo "::add-mask::$PW"
            echo "FOLIO_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "::warning::Secrets absents : clé temporaire"
          fi
          echo "FOLIO_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compiler l'APK signé
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publier le journal d'erreurs (branche build-log)
        if: failure()
        run: |
          { grep -nE "^e: |error:|What went wrong|Could not|Unresolved|> Task .* FAILED" -A4 build.log | head -400; echo "-----"; tail -120 build.log; } > build-errors.txt || true
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan build-log
          git rm -rfq . || true
          git add -f build-errors.txt
          git commit -qm "Journal de compilation #${GITHUB_RUN_NUMBER}"
          git push -f origin build-log

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk DocuScanPro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DocuScanPro-apk
          path: DocuScanPro.apk

      - name: Publier la release (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DocuScan Pro 1.0.${{ github.run_number }}
          body: |
            📥 Téléchargement direct : https://github.com/${{ github.repository }}/releases/latest/download/DocuScanPro.apk
          files: DocuScanPro.apk
          make_latest: true
