plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.docuscanpro.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.docuscanpro.app'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Clé fournie par les secrets GitHub (jamais stockée dans le dépôt)
    signingConfigs {
        release {
            storeFile file(System.getenv('FOLIO_KEYSTORE_PATH') ?: 'release.jks')
            storePassword System.getenv('FOLIO_KEYSTORE_PASSWORD')
            keyAlias 'folio'
            keyPassword System.getenv('FOLIO_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    packaging {
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Scanner Google ML Kit : détection des bords, recadrage, perspective, capture auto (hors-ligne)
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'

    // OCR sur l'appareil (alphabet latin : français, anglais, espagnol, allemand…)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Moteur PDF : fusion, division, signature, annotations, filigrane, mot de passe, compression
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
